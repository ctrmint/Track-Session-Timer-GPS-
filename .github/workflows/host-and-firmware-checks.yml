name: Host and firmware checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned host dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run host checks
        run: make check

  firmware-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build with pinned ESP-IDF image
        run: >-
          docker run --rm
          -e HOME=/tmp
          -e IDF_GIT_SAFE_DIR=/work
          -v "${{ github.workspace }}:/work"
          -w /work/firmware
          espressif/idf:v6.0.2
          bash -lc "idf.py set-target esp32s3 && idf.py build"
